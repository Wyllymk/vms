name: Build & Release Theme

on:
  push:
    tags:
      - "v*" # Runs only when you push a version tag like v1.0.0

permissions:
  contents: write # Required for creating releases with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Prepare build folder (exclude unnecessary files)
      - name: Prepare build
        run: |
          mkdir -p build/vms
          rsync -av --exclude build \
                    --exclude .git \
                    --exclude .github \
                    --exclude node_modules \
                    --exclude tests \
                    ./ build/vms/

      # 3. Create theme ZIP
      - name: Build theme zip
        run: |
          cd build
          # Ensure ZIP has 'vms/' at root
          zip -r -q vms.zip vms

      # 4. Create GitHub Release and upload the theme ZIP
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/vms.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
