name: Release Pre-Built Theme

on:
  push:
    tags:
      - "v*" # Run on version tags like v1.0.5

permissions:
  contents: write # Required for creating releases

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3      

      # 3. Upload the pre-built ZIP as a GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: vms.zip # <-- point directly to your pre-built ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
